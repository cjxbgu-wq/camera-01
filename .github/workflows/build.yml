name: Build VCam Pro Bypass

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: 应用 UI 补丁 (源码不动, 增量合并)
        run: |
          patch -p1 < UI-PATCH.diff > build.log 2>&1 || { echo PATCH-FAILED >> build.log; exit 1; }
          shasum Tweak.xm Makefile Modules/VCamBypassUI.m | tee -a build.log

      - name: 安装构建依赖 (ldid/xz)
        run: |
          brew install ldid xz

      - name: 克隆 Theos
        run: |
          for i in 1 2 3 4 5; do
            sudo git clone --recursive https://github.com/theos/theos $THEOS && break || echo "retry $i/5"
          done
          sudo chown -R "$USER" $THEOS

      - name: 下载 iOS 16.5 SDK
        run: |
          sudo mkdir -p $THEOS/sdks
          for i in 1 2 3 4 5; do
            sudo curl -L --fail -o $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz && break || echo "retry $i/5"
          done
          sudo tar -C $THEOS/sdks -xJf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz

      - name: 构建安装包
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 STRIP=1 2>&1 | tee -a build.log

      - name: 上传构建日志 (含失败)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: 回传 build.log 到 ci-logs 分支 (独立临时仓库, 不依赖工作区状态)
        if: always()
        run: |
          mkdir -p /tmp/ci-logs
          cp build.log /tmp/ci-logs/ 2>/dev/null || true
          cd /tmp/ci-logs
          git init -q
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config user.name ci-bot
          git config user.email ci@users.noreply.github.com
          git add -A
          git -c core.autocrlf=false commit -m "build log $(date -u +%Y%m%d-%H%M%S)" || true
          git push --force origin HEAD:ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: vcampro-bypass-deb
          path: packages/*.deb
          retention-days: 30