name: Build VCam Pro Bypass

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: /opt/theos

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: 应用 UI 补丁 (源码不动, 增量合并)
        run: |
          patch -p1 < UI-PATCH.diff
          shasum Tweak.xm Makefile Modules/VCamBypassUI.m | tee patched.shasum

      - name: 安装构建依赖 (ldid/xz)
        run: |
          brew install ldid xz

      - name: 克隆 Theos
        run: |
          for i in 1 2 3 4 5; do
            sudo git clone --recursive https://github.com/theos/theos $THEOS && break || echo "retry $i/5"
          done
          sudo chown -R "$USER" $THEOS

      - name: 下载 iOS 16.5 SDK
        run: |
          sudo mkdir -p $THEOS/sdks
          for i in 1 2 3 4 5; do
            sudo curl -L --fail -o $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz && break || echo "retry $i/5"
          done
          sudo tar -C $THEOS/sdks -xJf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz

      - name: 构建安装包
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 STRIP=1 2>&1 | tee build.log

      - name: 上传构建日志 (含失败)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

      - name: 失败时回传 build.log 到 ci-logs 分支
        if: failure()
        run: |
          git fetch origin ci-logs 2>/dev/null || true
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout --orphan ci-logs
          git rm -rf --cached . 2>/dev/null || true
          git add -f build.log
          git -c user.name="ci-bot" -c user.email="ci@users.noreply.github.com" commit -m "build log $(date -u +%Y%m%d-%H%M%S)" || true
          git push --force origin ci-logs
          git checkout -f main || true

      - uses: actions/upload-artifact@v4
        with:
          name: vcampro-bypass-deb
          path: packages/*.deb
          retention-days: 30